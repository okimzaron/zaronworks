<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0e0b09; color: #f3e6d3;
           font-family: system-ui, -apple-system, Segoe UI, sans-serif; text-align: center; padding: 16px; }
    h1 { font-family: Georgia, serif; font-size: 4rem; margin: 0; color: #f2b896; }
    p { color: #b5a291; }
    nav { display: flex; gap: 12px; justify-content: center; margin-top: 24px; flex-wrap: wrap; }
    a { padding: 10px 20px; border-radius: 999px; border: 1px solid rgba(243,230,211,.2); color: #f3e6d3; text-decoration: none; }
    a:first-child { background: #f2b896; color: #0e0b09; border-color: #f2b896; }
    a.r { border-color: rgba(139,92,246,.5); background: rgba(139,92,246,.12); }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>That page doesn't exist, or it moved.</p>
    <nav>
      <!-- Absolute paths: edit if the site lives in a sub-folder (e.g. /my-repo/) -->
      <a href="/">Portfolio home</a>
      <a class="r" href="https://reaperlib.online/">Reaper</a>
    </nav>
  </main>
</body>
</html>
